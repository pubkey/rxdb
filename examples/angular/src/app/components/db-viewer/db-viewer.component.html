<button
    type="button"
    class="db-viewer-toggle"
    id="db-viewer-toggle"
    (click)="toggle()"
    [title]="open() ? 'Close the database viewer' : 'Open the database viewer'"
>{{ open() ? 'Close DB Viewer ×' : 'Open DB Viewer' }}</button>
<div class="db-viewer-dock" [class.open]="open()">
    <div class="db-viewer-host" #viewerHost></div>
</div>
