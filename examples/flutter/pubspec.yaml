name: rxdb_flutter_example
description: "Example app that uses RxDB as Flutter database."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # In your app, use the version from pub.dev instead: `flutter pub add rxdb`
  rxdb:
    path: ../../src/plugins/flutter/dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
