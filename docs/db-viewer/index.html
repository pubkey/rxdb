    --rxdbv-type-missing: #3A4256;

    --rxdbv-danger: #FD366E;
    --rxdbv-warning: #EBCB4B;
    --rxdbv-info: #199BF1;
    --rxdbv-violet: #9B6BFF;
    --rxdbv-gradient: linear-gradient(90deg, #ED168F, #B2218B, #752A8A);

    /**

    --rxdbv-font: 'Atkinson Hyperlegible Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;
    --rxdbv-mono: 'Atkinson Hyperlegible Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace;

    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    min-height: 300px;
    background: var(--rxdbv-bg-dark);
    color: var(--rxdbv-fg);
    font-family: var(--rxdbv-font);
    font-size: 12px;
    letter-spacing: 0.01em;
    overflow: hidden;
    box-sizing: border-box;
    text-align: left;
}
.rxdbv-root *, .rxdbv-root *::before, .rxdbv-root *::after { box-sizing: border-box; }
.rxdbv-root ::-webkit-scrollbar { width: 8px; height: 8px; }
.rxdbv-root ::-webkit-scrollbar-thumb { background: var(--rxdbv-active-segment); border-radius: 4px; }
.rxdbv-root a {
    color: var(--rxdbv-fg);
    text-decoration: underline;
    text-decoration-color: var(--rxdbv-pink);
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: pointer;
}
.rxdbv-root a:hover { color: var(--rxdbv-pink); }
.rxdbv-mono { font-family: var(--rxdbv-mono); }
.rxdbv-dim { color: var(--rxdbv-fg-dim); }
.rxdbv-muted { color: var(--rxdbv-fg-muted); }
.rxdbv-flex1 { flex: 1; }

@keyframes rxdbvFlowR { from { left: -2px; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { left: 100%; opacity: 0; } }
@keyframes rxdbvFlowL { from { left: 100%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { left: -2px; opacity: 0; } }
@keyframes rxdbvBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@keyframes rxdbvRowIn { from { background: rgba(22, 237, 143, 0.22); } to { background: transparent; } }
@keyframes rxdbvNodePulse { 0% { border-color: rgba(255, 255, 255, 0.45); } 100% { border-color: rgba(255, 255, 255, 0.12); } }
@keyframes rxdbvThread { from { background-position: 0 0; } to { background-position: -16px 0; } }

/* buttons */
/**
 * All buttons use the fixed proportions of the landing page
 * button (docs-src/src/components/button.tsx): 45px height,
 * 25px side padding and a 2px border at a 16px font, scaled
 * to the viewer font sizes (11px -> 31px/17px, 10px -> 28px/16px).
 * The border width stays 2px at every size.
 */
.rxdbv-btn {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    gap: 7px;
    height: 31px;
    padding: 0 17px;
    border: 2px solid var(--rxdbv-control-border);
    background: transparent;
    color: var(--rxdbv-fg);
    font-size: 11px;
    font-weight: 500;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
    transition: background 180ms ease-in-out, color 180ms ease-in-out, transform 80ms ease;
}
.rxdbv-btn:hover { background: var(--rxdbv-fg); color: var(--rxdbv-bg-dark); }
.rxdbv-btn:active { transform: translateY(1px); }
.rxdbv-btn:disabled { opacity: 0.5; cursor: default; }
.rxdbv-btn:disabled:hover { background: transparent; color: var(--rxdbv-fg); }
.rxdbv-btn-small { font-size: 10px; height: 28px; padding: 0 16px; }
.rxdbv-selection-actions { display: inline-flex; align-items: center; gap: 8px; }
.rxdbv-btn-icon { width: 31px; padding: 0; }
.rxdbv-btn-primary {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 31px;
    padding: 0 17px;
    border: 0;
    background: var(--rxdbv-gradient);
    color: var(--rxdbv-fg);
    font-weight: 800;
    font-size: 11px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
    transition: transform 80ms ease;
}
.rxdbv-btn-primary:active { transform: translateY(1px); }
.rxdbv-btn-primary:disabled { opacity: 0.4; cursor: default; }
.rxdbv-btn-danger-outline {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 31px;
    padding: 0 17px;
    border: 2px solid var(--rxdbv-danger);
    background: transparent;
    color: var(--rxdbv-danger);
    font-weight: 700;
    font-size: 11px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
    transition: background 180ms ease-in-out, color 180ms ease-in-out;
}
.rxdbv-btn-danger-outline:hover { background: var(--rxdbv-danger); color: var(--rxdbv-fg); }

/* top bar */
.rxdbv-topbar {
    position: relative;
    height: 44px;
    min-height: 44px;
    background: var(--rxdbv-purple-header);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    font-size: 12px;
}
.rxdbv-logo {
    width: 13px;
    height: 17px;
    display: inline-flex;
    align-items: center;
}
.rxdbv-logo svg { width: 100%; height: 100%; }
.rxdbv-wordmark { font-weight: 800; letter-spacing: 0.02em; }
.rxdbv-topbar-divider { color: rgba(255, 255, 255, 0.25); }
.rxdbv-topbar-identity { font-family: var(--rxdbv-mono); font-size: 11px; color: var(--rxdbv-fg-muted); }
/* copy to clipboard */
.rxdbv-json-wrap { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.rxdbv-copy-btn {
    position: absolute;
    top: 8px;
    right: 12px;
    z-index: 5;
    border: 2px solid var(--rxdbv-control-border);
    background: var(--rxdbv-bg);
    color: var(--rxdbv-fg-muted);
    padding: 4px 6px;
    border-radius: 0;
    cursor: pointer;
    line-height: 0;
    opacity: 0.6;
    transition: opacity 180ms ease-in-out, color 180ms ease-in-out;
}
.rxdbv-json-wrap:hover .rxdbv-copy-btn, .rxdbv-copy-btn:hover { opacity: 1; }
.rxdbv-copy-btn.rxdbv-copied { color: var(--rxdbv-success); opacity: 1; }

/* banners */
.rxdbv-banner-dump {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    background: rgba(235, 203, 75, 0.08);
    border-bottom: 1px solid rgba(235, 203, 75, 0.35);
    font-size: 11px;
}

/* body layout */
.rxdbv-body { flex: 1; display: flex; min-height: 0; }
.rxdbv-content { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* rail */
.rxdbv-rail {
    width: 200px;
    min-width: 200px;
    background: var(--rxdbv-bg-dark);
    border-right: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    flex-direction: column;
    font-size: 11px;
    padding: 10px 0;
    overflow-y: auto;
}
.rxdbv-rail-header {
    padding: 4px 12px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--rxdbv-fg-dim);
}
.rxdbv-rail-header + .rxdbv-rail-header,
.rxdbv-rail-item + .rxdbv-rail-header { padding-top: 14px; }
.rxdbv-rail-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 12px 4px 10px;
    border-left: 2px solid transparent;
    color: var(--rxdbv-fg-muted);
    cursor: pointer;
    transition: background 180ms ease-in-out, color 180ms ease-in-out;
}
.rxdbv-rail-subitem {
    padding-left: 26px;
    font-size: 11px;
}
.rxdbv-topbar-transport {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 10px;
    padding: 1px 7px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: var(--rxdbv-fg-muted);
    font-size: 10px;
    font-family: var(--rxdbv-mono);
}
.rxdbv-transport-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rxdbv-success); }
.rxdbv-topbar-crumb { cursor: pointer; }
.rxdbv-topbar-crumb:hover { color: var(--rxdbv-pink); }
.rxdbv-rail-group { cursor: default; }
.rxdbv-rail-group:hover { background: transparent; }
.rxdbv-rail-item:hover { background: rgba(255, 255, 255, 0.05); }
.rxdbv-rail-item.rxdbv-active {
    border-left-color: var(--rxdbv-pink);
    background: rgba(237, 22, 143, 0.10);
    color: var(--rxdbv-fg);
}
.rxdbv-rail-item .rxdbv-rail-label { flex: 1; font-family: var(--rxdbv-mono); }
.rxdbv-rail-item .rxdbv-rail-count { color: var(--rxdbv-fg-dim); font-family: var(--rxdbv-mono); }
.rxdbv-rail-settings {
    padding: 6px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--rxdbv-fg-muted);
    cursor: pointer;
}
.rxdbv-rail-settings:hover { color: var(--rxdbv-fg); }
.rxdbv-rail-spacer { flex: 1; }

/* toolbar */
.rxdbv-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    flex-wrap: wrap;
}
.rxdbv-toolbar-title { font-weight: 700; font-size: 13px; }
/**
 * Tabs, same design as the docs Tabs component
 * (docs-src/src/components/tabs.tsx with .side-tabs in
 * custom.css): flat labels, the active tab has a filled
 * background, bold text and a 3px indicator bar in the
 * brand color.
 */
/* the tab row sits directly above the content box */
.rxdbv-tabs-row { display: flex; align-items: center; padding: 10px 12px 8px; }
.rxdbv-tabs {
    display: inline-flex;
    align-items: stretch;
    gap: 3px;
    height: 31px;
}
.rxdbv-tab {
    box-sizing: border-box;
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 17px;
    border: 2px solid var(--rxdbv-bg);
    background: transparent;
    color: var(--rxdbv-fg);
    font-size: 11px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: color 180ms ease-in-out, background 180ms ease-in-out;
}
.rxdbv-tab:hover:not(.rxdbv-active) { font-weight: 800; }
.rxdbv-tab.rxdbv-active { background: var(--rxdbv-bg); color: var(--rxdbv-fg); font-weight: 800; }
.rxdbv-tab.rxdbv-active::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    height: 3px;
    background: #ED168F;
}
/**
 * The standard input. Same fixed 31px height and 2px border

 */
.rxdbv-input {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 31px;
    padding: 0 10px;
    background: var(--rxdbv-bg);
    border: 2px solid var(--rxdbv-control-border);
    color: var(--rxdbv-fg);
    font-family: var(--rxdbv-mono);
    font-size: 11px;
    outline: none;
}
.rxdbv-input::placeholder { color: var(--rxdbv-fg-dim); }

/* the standard button with a leading icon, here the observe dot */
.rxdbv-observe {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--rxdbv-fg-muted);
}
.rxdbv-observe .rxdbv-observe-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rxdbv-fg-dim); }
.rxdbv-observe:hover .rxdbv-observe-dot { background: var(--rxdbv-bg-dark); }
.rxdbv-observe.rxdbv-active { border-color: var(--rxdbv-success); color: var(--rxdbv-success); }
.rxdbv-observe.rxdbv-active .rxdbv-observe-dot { background: var(--rxdbv-success); }
.rxdbv-observe.rxdbv-active:hover { background: rgba(22, 237, 143, 0.12); color: var(--rxdbv-success); }
.rxdbv-observe.rxdbv-active:hover .rxdbv-observe-dot { background: var(--rxdbv-success); }
.rxdbv-observe.rxdbv-disabled { opacity: 0.5; cursor: default; }
.rxdbv-observe.rxdbv-disabled:hover { background: transparent; color: var(--rxdbv-fg-muted); }
.rxdbv-observe.rxdbv-disabled:hover .rxdbv-observe-dot { background: var(--rxdbv-fg-dim); }

/* query bar */
.rxdbv-querybar {
    display: flex;
    flex-wrap: wrap;

.rxdbv-num-input-wrap { width: 102px; flex: none; display: flex; font-size: 11.5px; }
.rxdbv-num-input-wrap .rxdbv-query-input { text-align: right; width: 100%; }
.rxdbv-sort-input-wrap { width: 180px; position: relative; gap: 6px; }
.rxdbv-sort-field,
.rxdbv-sort-dir {

    font-family: var(--rxdbv-mono);

    cursor: pointer;
}
.rxdbv-sort-field { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rxdbv-sort-dir { color: var(--rxdbv-fg-muted); }
.rxdbv-sort-dir:hover { color: var(--rxdbv-fg); }
.rxdbv-sort-dir:disabled { color: var(--rxdbv-fg-dim); cursor: default; }
.rxdbv-sort-dropdown {

    max-height: 280px;
    overflow-y: auto;
    font-size: 11px;
}
.rxdbv-input.rxdbv-error { border-color: var(--rxdbv-danger); }
.rxdbv-query-input-wrap.rxdbv-error { border-color: var(--rxdbv-danger); }
.rxdbv-query-input-wrap.rxdbv-focus { border-color: var(--rxdbv-pink); }
.rxdbv-query-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: var(--rxdbv-fg);
    font-family: var(--rxdbv-mono);
    font-size: 11.5px;
    padding: 0;
}
.rxdbv-query-dropdown {
    position: absolute;
    top: 100%;
    left: 12px;
    right: 12px;
    margin-top: -4px;
    background: var(--rxdbv-bg-code);
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 11px;
    z-index: 40;
    max-height: 320px;
    overflow-y: auto;
}
.rxdbv-query-dropdown-header {
    padding: 6px 10px 2px;

.rxdbv-query-dropdown-header + .rxdbv-query-dropdown-header { border-top: 1px solid rgba(255, 255, 255, 0.08); }
.rxdbv-query-dropdown-row { display: flex; gap: 10px; padding: 4px 10px; cursor: pointer; align-items: baseline; }
.rxdbv-query-dropdown-row:hover, .rxdbv-query-dropdown-row.rxdbv-active { background: rgba(255, 255, 255, 0.05); }
.rxdbv-query-dropdown-row .rxdbv-fav-star { color: var(--rxdbv-pink); }
.rxdbv-query-dropdown-row .rxdbv-recent-glyph { color: var(--rxdbv-fg-dim); }
.rxdbv-query-dropdown-row .rxdbv-fav-name { width: 110px; color: var(--rxdbv-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rxdbv-query-dropdown-row .rxdbv-query-text { font-family: var(--rxdbv-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.rxdbv-query-dropdown-footer { padding: 5px 10px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: var(--rxdbv-fg-dim); font-size: 10px; }

.rxdbv-query-error-message { font-family: var(--rxdbv-mono); font-size: 11px; color: var(--rxdbv-danger); }
.rxdbv-query-error-caret { font-family: var(--rxdbv-mono); font-size: 11px; color: var(--rxdbv-fg-dim); white-space: pre; margin-top: 4px; }
.rxdbv-query-error-caret .rxdbv-caret { color: var(--rxdbv-danger); }
.rxdbv-query-error-hint { color: var(--rxdbv-fg-muted); font-size: 11px; margin-top: 10px; line-height: 1.55; }

    top: 0;
    background: var(--rxdbv-bg-dark);
    z-index: 2;
}
.rxdbv-grid-header > div { padding: 5px 8px 5px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rxdbv-grid-header > div.rxdbv-sorted { color: var(--rxdbv-fg); }
.rxdbv-sort-arrow { color: var(--rxdbv-pink); font-size: 11px; line-height: 1; margin-left: 5px; }
.rxdbv-sort-arrow-asc { color: var(--rxdbv-success); }
.rxdbv-grid-virtual { position: relative; }
.rxdbv-grid-row {
    display: grid;
    align-items: center;
    height: 24px;
    box-sizing: border-box;
    padding: 0 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    font-size: 11px;
    cursor: pointer;
    transition: background 180ms ease-in-out;
}
.rxdbv-grid-row:hover { background: rgba(255, 255, 255, 0.04); }
.rxdbv-grid-row.rxdbv-selected { background: rgba(237, 22, 143, 0.10); }
.rxdbv-grid-row.rxdbv-fresh { animation: rxdbvRowIn 2s ease-out; }
.rxdbv-grid-row > div { padding: 0 8px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rxdbv-grid-checkbox-cell { padding: 0 !important; display: flex; align-items: center; }
.rxdbv-root input[type='checkbox'] { accent-color: var(--rxdbv-pink); width: 12px; height: 12px; margin: 0; }
.rxdbv-cell-edit-input {
    background: var(--rxdbv-bg);
    border: 2px solid var(--rxdbv-pink);
    color: var(--rxdbv-fg);
    font-size: 11px;
    font-family: inherit;
    padding: 1px 6px;
    width: 90%;
    outline: none;
}
.rxdbv-grid-footer {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11px;
    color: var(--rxdbv-fg-muted);
    flex-wrap: wrap;
}
.rxdbv-pager {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 2px solid var(--rxdbv-control-border);
    background: transparent;
    color: var(--rxdbv-fg);
    font-size: 11px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
}
.rxdbv-pager:disabled { color: var(--rxdbv-fg-dim); opacity: 0.5; cursor: default; }
.rxdbv-pager:not(:disabled):hover { background: var(--rxdbv-fg); color: var(--rxdbv-bg-dark); }

/* JSON view */
.rxdbv-json-view {
    flex: 1;
    overflow: auto;
    margin: 8px 12px;
    background: var(--rxdbv-bg-code);
    border: 2px solid #666;
    padding: 10px 14px;
    font-family: var(--rxdbv-mono);
    font-size: 11px;
    line-height: 1.65;
    white-space: pre;
}
.rxdbv-json-key { color: var(--rxdbv-fg); }
.rxdbv-json-str { color: var(--rxdbv-type-string); }
.rxdbv-json-num { color: var(--rxdbv-type-number); }
.rxdbv-json-bool { color: var(--rxdbv-type-boolean); }
.rxdbv-json-null { color: var(--rxdbv-fg-dim); }
.rxdbv-json-doc-fresh { background: rgba(22, 237, 143, 0.08); display: block; }
.rxdbv-json-fresh-note { color: var(--rxdbv-success); }

/* drawer */
.rxdbv-drawer {
    width: 340px;
    min-width: 340px;
    border-left: 1px solid rgba(255, 255, 255, 0.14);
    background: var(--rxdbv-bg-detail);
    display: flex;
    flex-direction: column;
    overflow: auto;
    font-size: 11px;
}
.rxdbv-drawer-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.rxdbv-badge-edited { font-size: 9px; border: 1px solid rgba(237, 22, 143, 0.5); color: var(--rxdbv-pink); padding: 1px 6px; }
.rxdbv-close { color: var(--rxdbv-fg-dim); cursor: pointer; font-size: 14px; }
.rxdbv-close:hover { color: var(--rxdbv-fg); }
.rxdbv-drawer-tabs { padding: 10px 12px 0; }
.rxdbv-json-edit {
    width: 100%;
    min-height: 240px;
    box-sizing: border-box;
    background: var(--rxdbv-bg-code);
    border: 2px solid #666;
    color: var(--rxdbv-fg);
    font-family: var(--rxdbv-mono);
    font-size: 11px;
    line-height: 1.5;
    padding: 8px 10px;
    resize: vertical;
    outline: none;
}
.rxdbv-json-edit-error {
    color: var(--rxdbv-danger);
    font-family: var(--rxdbv-mono);
    font-size: 10.5px;
    min-height: 15px;
    padding: 4px 0;
}
.rxdbv-drawer-section {
    padding: 8px 12px 2px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.09em;
    color: var(--rxdbv-fg-dim);
}
.rxdbv-drawer-section.rxdbv-bordered { border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 8px; padding-top: 10px; }
.rxdbv-drawer-section.rxdbv-willrun { color: var(--rxdbv-pink); }
.rxdbv-field-row { display: flex; gap: 8px; padding: 3px 12px; align-items: center; }
.rxdbv-field-row .rxdbv-field-label { width: 80px; min-width: 80px; color: var(--rxdbv-fg-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rxdbv-field-row .rxdbv-field-value { font-family: var(--rxdbv-mono); color: var(--rxdbv-fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; height: 31px; line-height: 31px; }
.rxdbv-field-row .rxdbv-field-value.rxdbv-string { color: var(--rxdbv-type-string); }
.rxdbv-field-row .rxdbv-expand-toggle { cursor: pointer; }
.rxdbv-field-child { display: flex; gap: 8px; padding: 2px 12px 2px 28px; font-family: var(--rxdbv-mono); }
.rxdbv-field-child .rxdbv-field-label { width: 64px; min-width: 64px; color: var(--rxdbv-fg-dim); }
.rxdbv-field-input {
    flex: 1;
    box-sizing: border-box;
    height: 31px;
    background: var(--rxdbv-bg);
    border: 2px solid var(--rxdbv-pink);
    color: var(--rxdbv-fg);
    font-size: 11px;
    font-family: var(--rxdbv-mono);
    padding: 0 6px;
    outline: none;
    min-width: 0;
}
.rxdbv-field-input.rxdbv-clean { border-color: var(--rxdbv-control-border); }
.rxdbv-field-select { cursor: pointer; }
.rxdbv-field-select option { background: var(--rxdbv-bg); color: var(--rxdbv-fg); }
.rxdbv-modified-dot { width: 6px; height: 6px; min-width: 6px; border-radius: 50%; background: var(--rxdbv-pink); }
.rxdbv-badge-primary { font-size: 9px; color: var(--rxdbv-fg-dim); border: 1px solid rgba(255, 255, 255, 0.15); padding: 0 4px; }
.rxdbv-attachment-box { margin: 4px 12px; border: 1px solid rgba(255, 255, 255, 0.12); }
.rxdbv-attachment-row { display: flex; gap: 8px; padding: 4px 8px; align-items: center; }
.rxdbv-attachment-preview {
    max-height: 140px;
    overflow: hidden;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--rxdbv-bg-detail);
}
.rxdbv-attachment-preview img { max-width: 100%; max-height: 140px; }
.rxdbv-willrun-code {
    margin: 4px 12px;
    background: var(--rxdbv-bg-code);
    border: 2px solid #666;
    padding: 8px 10px;
    font-family: var(--rxdbv-mono);
    font-size: 10.5px;
    line-height: 1.6;
    white-space: pre;
    overflow: auto;
}
.rxdbv-willrun-code .rxdbv-changed-line { background: rgba(237, 22, 143, 0.18); display: block; }
.rxdbv-willrun-code .rxdbv-comment { color: var(--rxdbv-fg-dim); }
.rxdbv-drawer-actions { display: flex; gap: 8px; padding: 8px 12px 14px; }

/* modal */
.rxdbv-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(9, 11, 18, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
}
.rxdbv-modal {
    width: 440px;
    max-width: 92%;
    background: var(--rxdbv-bg);
    border: 1px solid rgba(255, 255, 255, 0.20);
    border-top: 2px solid var(--rxdbv-danger);
    padding: 18px 20px;
    font-size: 12px;
}
.rxdbv-modal-title { font-weight: 700; font-size: 14px; }
.rxdbv-modal-body { color: var(--rxdbv-fg-muted); margin-top: 8px; line-height: 1.55; font-size: 11.5px; }
.rxdbv-modal-body code { font-family: var(--rxdbv-mono); color: var(--rxdbv-fg); }
.rxdbv-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.rxdbv-btn-danger-solid {
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 31px;
    padding: 0 17px;
    border: 0;
    background: var(--rxdbv-danger);
    color: var(--rxdbv-fg);
    font-weight: 700;
    font-size: 11px;
    border-radius: 0;
    cursor: pointer;
    font-family: inherit;
}
.rxdbv-btn-danger-solid:disabled { opacity: 0.5; cursor: default; }

/* panels shared */
.rxdbv-panel-scroll { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: auto; }
.rxdbv-stat-cards { display: flex; gap: 12px; padding: 14px 12px; flex-wrap: wrap; }
.rxdbv-stat-card { flex: 1; min-width: 150px; background: var(--rxdbv-bg); border: 1px solid rgba(255, 255, 255, 0.10); padding: 10px 12px; }
.rxdbv-stat-card .rxdbv-stat-label { font-size: 9px; letter-spacing: 0.09em; color: var(--rxdbv-fg-dim); font-weight: 600; }
.rxdbv-stat-card .rxdbv-stat-value { font-family: var(--rxdbv-mono); font-size: 13px; margin-top: 4px; }
.rxdbv-section-label { padding: 12px 12px 0; font-size: 9px; font-weight: 600; letter-spacing: 0.09em; color: var(--rxdbv-fg-dim); }
.rxdbv-table-header {
    display: grid;
    padding: 0 12px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--rxdbv-fg-dim);
}
.rxdbv-table-header > div { padding: 5px 8px 5px 0; }
.rxdbv-table-row { display: grid; padding: 0 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 11px; align-items: center; }
.rxdbv-table-row > div { padding: 6px 8px 6px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rxdbv-table-row.rxdbv-clickable { cursor: pointer; }
.rxdbv-table-row.rxdbv-clickable:hover { background: rgba(255, 255, 255, 0.04); }
.rxdbv-table-row.rxdbv-selected { background: rgba(237, 22, 143, 0.10); }
.rxdbv-type-bar { display: flex; height: 10px; width: 240px; max-width: 100%; background: var(--rxdbv-neutral-bar); }
/**
 * Info boxes, same design as the docs admonitions
 * (.alert.alert--info in docs-src/src/css/custom.css):
 * square corners, dark background and a colored border
 * with the thicker left edge of the docs alerts. The info
 * color is --color-middle of the docs.
 */
.rxdbv-admonition {
    margin: 6px 12px;
    padding: 12px 14px;
    font-size: 11.5px;
    background: var(--rxdbv-bg);
    border: 1px solid #B2218B;
    border-left-width: 5px;
    border-radius: 0;
}
.rxdbv-admonition-warning { border-color: var(--rxdbv-warning); }
.rxdbv-admonition-danger { border-color: var(--rxdbv-danger); }
.rxdbv-admonition-title { font-weight: 700; }
.rxdbv-admonition-warning .rxdbv-admonition-title { color: var(--rxdbv-warning); }
.rxdbv-admonition-danger .rxdbv-admonition-title { color: var(--rxdbv-danger); }
.rxdbv-admonition-body { color: var(--rxdbv-fg-muted); margin-top: 4px; line-height: 1.55; }
.rxdbv-admonition-body:first-child { margin-top: 0; }
.rxdbv-admonition-body code { font-family: var(--rxdbv-mono); color: var(--rxdbv-fg); }
.rxdbv-plan-box { margin: 6px 12px; border: 2px solid #666; background: var(--rxdbv-bg-code); font-size: 11px; font-family: var(--rxdbv-mono); }
.rxdbv-plan-step { display: flex; gap: 12px; padding: 6px 10px; }
.rxdbv-plan-step + .rxdbv-plan-step { border-top: 1px solid rgba(255, 255, 255, 0.06); }
.rxdbv-plan-step .rxdbv-plan-num { color: var(--rxdbv-fg-dim); width: 14px; }
.rxdbv-plan-step .rxdbv-plan-desc { flex: 1; }
.rxdbv-cleanup-card { margin: 16px 12px; border: 1px solid rgba(255, 255, 255, 0.12); padding: 12px; max-width: 640px; }

/* changes panel */
.rxdbv-split { flex: 1; display: flex; min-height: 0; }
.rxdbv-split-left { flex: 1; overflow: auto; min-width: 0; border-right: 1px solid rgba(255, 255, 255, 0.10); }
.rxdbv-split-right { width: 460px; min-width: 460px; overflow: auto; background: var(--rxdbv-bg-detail); }
/**
 * Below 760px the master/detail split stacks vertically, so
 * the detail pane and its code boxes never exceed the screen.
 */
@media (max-width: 760px) {
    .rxdbv-split { flex-direction: column; }
    .rxdbv-split-left { flex: 0 1 auto; max-height: 45%; border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.10); }
    .rxdbv-split-right { width: auto; min-width: 0; flex: 1; }
    /**
     * The changes list shows time, op, collection and id on
     * narrow screens. The rev column is left out and the cells
     * clip, so the grid never exceeds the screen.
     */
    .rxdbv-split-left .rxdbv-table-header,
    .rxdbv-split-left .rxdbv-table-row {
        grid-template-columns: 72px 52px 1fr 1fr !important;
    }
    .rxdbv-split-left .rxdbv-table-header > div:nth-child(3),
    .rxdbv-split-left .rxdbv-table-row > div:nth-child(3) { display: none; }
    .rxdbv-split-left .rxdbv-table-header > div,
    .rxdbv-split-left .rxdbv-table-row > div {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
}
.rxdbv-filter-input { width: 190px; }
.rxdbv-diff-block { margin: 8px 12px; background: var(--rxdbv-bg-code); border: 2px solid #666; padding: 10px 12px; font-family: var(--rxdbv-mono); font-size: 11px; line-height: 1.7; white-space: pre; overflow: auto; }
.rxdbv-diff-line-removed { background: rgba(253, 54, 110, 0.14); color: var(--rxdbv-danger); display: block; }
.rxdbv-diff-line-added { background: rgba(22, 237, 143, 0.12); color: var(--rxdbv-success); display: block; }
.rxdbv-diff-line-same { display: block; }
.rxdbv-willrun-code .rxdbv-plain-line { display: block; }

/* live map */
.rxdbv-live-map { flex: 1; display: flex; min-height: 0; padding: 14px 12px; gap: 0; overflow: auto; }
.rxdbv-live-col-app { width: 186px; min-width: 186px; display: flex; flex-direction: column; gap: 8px; }
.rxdbv-live-col-header { font-size: 9px; letter-spacing: 0.09em; color: var(--rxdbv-fg-dim); font-weight: 600; }
.rxdbv-live-node { border: 1px solid rgba(255, 255, 255, 0.20); background: var(--rxdbv-bg); padding: 9px 10px; }
.rxdbv-live-rows { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.rxdbv-live-row { display: flex; align-items: center; min-height: 84px; }
/**
 * The lanes stretch over the full row height and position their
 * two tracks symmetrically around the vertical center, so the
 * lines always meet the nodes left and right at their middle.
 */
.rxdbv-live-lane { flex: 1; min-width: 70px; align-self: stretch; position: relative; }
.rxdbv-live-track { position: absolute; left: 0; right: 0; height: 13px; }
.rxdbv-live-lane > .rxdbv-live-track:nth-child(1) { top: calc(50% - 15px); }
.rxdbv-live-lane > .rxdbv-live-track:nth-child(2) { top: calc(50% + 2px); }
.rxdbv-live-track .rxdbv-track-line { position: absolute; top: 6px; left: 0; right: 0; height: 1px; background: rgba(255, 255, 255, 0.14); }
.rxdbv-live-track .rxdbv-track-line.rxdbv-thread {
    background: repeating-linear-gradient(90deg, rgba(25, 155, 241, 0.7) 0 6px, transparent 6px 12px);
    height: 1px;
    animation: rxdbvThread 1.4s linear infinite;
}
.rxdbv-live-particle {
    position: absolute;
    top: -1px;
    font-family: var(--rxdbv-mono);
    font-size: 12px;
    font-weight: 700;
}
.rxdbv-live-lane-label {
    position: absolute;
    top: calc(50% + 19px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: 10px;
    color: var(--rxdbv-fg-muted);
    font-family: var(--rxdbv-mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.rxdbv-live-lane.rxdbv-no-edge .rxdbv-live-track { display: none; }
.rxdbv-live-coll-node { width: 296px; min-width: 296px; border: 1px solid rgba(255, 255, 255, 0.12); background: var(--rxdbv-bg-detail); padding: 9px 10px; }
.rxdbv-live-coll-node.rxdbv-pulse { animation: rxdbvNodePulse 0.25s ease-out; }
.rxdbv-sparkline { display: flex; align-items: flex-end; gap: 1.5px; height: 26px; margin-top: 7px; }
.rxdbv-sparkline > div { flex: 1; background: #2F6B8F; min-height: 1px; }
.rxdbv-live-remote-node { width: 186px; min-width: 186px; border: 1px solid rgba(255, 255, 255, 0.14); background: var(--rxdbv-bg); padding: 9px 10px; }
.rxdbv-live-remote-node.rxdbv-none { border-color: rgba(255, 255, 255, 0.08); background: transparent; }
.rxdbv-live-remote-node.rxdbv-error { border-color: rgba(253, 54, 110, 0.5); background: rgba(253, 54, 110, 0.07); }
.rxdbv-live-summary {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 7px 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.10);
    font-size: 11px;
    font-family: var(--rxdbv-mono);
    flex-wrap: wrap;
}
/**
 * Idle rows fade their graphics but never their text,
 * faded labels on the dark background are unreadable.
 */
/**
 * Below 760px the live map flows top-down: app node, then per
 * collection its node and remote stacked. The horizontal lanes
 * and the column headers only make sense side by side, so they
 * are not drawn.
 */
@media (max-width: 760px) {
    .rxdbv-live-map { flex-direction: column; gap: 12px; overflow-x: hidden; }
    .rxdbv-live-col-app { width: auto; min-width: 0; }
    .rxdbv-live-rows > div:first-child { display: none !important; }
    .rxdbv-live-row { flex-direction: column; align-items: stretch; gap: 8px; min-height: 0; }
    .rxdbv-live-lane { display: none; }
    .rxdbv-live-coll-node,
    .rxdbv-live-remote-node { width: auto; min-width: 0; }
}
.rxdbv-live-idle .rxdbv-live-track { opacity: 0.45; }
.rxdbv-live-idle .rxdbv-live-coll-node,
.rxdbv-live-idle .rxdbv-live-remote-node { opacity: 0.8; }
.rxdbv-live-subpanel { position: absolute; inset: 0; background: rgba(9, 11, 18, 0.85); display: flex; align-items: center; justify-content: center; z-index: 50; }
.rxdbv-live-subpanel-box { width: 780px; max-width: 94%; max-height: 88%; overflow: auto; background: var(--rxdbv-bg-dark); border: 1px solid rgba(255, 255, 255, 0.14); font-size: 12px; }
.rxdbv-live-compact-bar { height: 6px; background: var(--rxdbv-bg); margin-top: 6px; }
.rxdbv-live-compact-bar > div { height: 100%; }

/* empty states */
.rxdbv-empty-state { flex: 1; display: flex; align-items: center; justify-content: center; }
.rxdbv-empty-inner { width: 400px; max-width: 90%; text-align: center; }
.rxdbv-empty-title { font-weight: 800; font-size: 14px; }
.rxdbv-empty-body { color: var(--rxdbv-fg-muted); font-size: 11.5px; margin-top: 6px; line-height: 1.55; }
.rxdbv-empty-body code { font-family: var(--rxdbv-mono); color: var(--rxdbv-fg); background: var(--rxdbv-bg-code); padding: 1px 5px; }
.rxdbv-empty-code {
    margin-top: 10px;
    background: var(--rxdbv-bg-code);
    border: 2px solid #666;
    padding: 8px 12px;
    font-family: var(--rxdbv-mono);
    font-size: 11px;
    text-align: left;
    white-space: pre;
    overflow: auto;
}
.rxdbv-empty-actions { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }

/* error popup */
.rxdbv-error-modal-message {
    font-family: var(--rxdbv-mono);
    font-size: 11.5px;
    color: var(--rxdbv-danger);
    margin-top: 10px;
    line-height: 1.55;
    word-break: break-word;
    max-height: 140px;
    overflow: auto;
}
.rxdbv-error-modal-params {
    margin-top: 10px;
    background: var(--rxdbv-bg-code);
    border: 1px solid rgba(255, 255, 255, 0.10);
    font-family: var(--rxdbv-mono);
    font-size: 10.5px;
    line-height: 1.6;
    white-space: pre;
    overflow: auto;
    max-height: 260px;
    padding: 8px 10px;
}

/* phone layout */
.rxdbv-phone-header {
    position: relative;
    height: 48px;
    min-height: 48px;
    background: var(--rxdbv-purple-header);
    border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    font-size: 13px;
}
.rxdbv-phone-back { color: var(--rxdbv-fg-muted); font-size: 16px; cursor: pointer; }
.rxdbv-phone-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    min-height: 44px;
    cursor: pointer;
    font-size: 13px;
}
.rxdbv-phone-row:hover { background: rgba(255, 255, 255, 0.04); }
.rxdbv-phone-subrow { padding-left: 30px; font-size: 12px; color: var(--rxdbv-fg-muted); }
.rxdbv-phone-group { cursor: default; }
.rxdbv-phone-group:hover { background: transparent; }
.rxdbv-phone-note { padding: 12px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: var(--rxdbv-fg-dim); font-size: 11px; }
.rxdbv-phone-field { padding: 8px 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); font-size: 13px; }
.rxdbv-phone-header-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    font-weight: 700;
    font-size: 12px;
    pointer-events: none;
    white-space: nowrap;
}
.rxdbv-phone-tool-host { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: auto; }
.rxdbv-phone-tool-host > * { min-width: 0; }
/**
 * The phone header already names the open tool, so the panel
 * toolbar does not repeat it. A toolbar that held only the
 * title disappears entirely.
 */
.rxdbv-phone-tool-host .rxdbv-toolbar-title { display: none; }
.rxdbv-phone-tool-host .rxdbv-toolbar:not(:has(> :not(.rxdbv-toolbar-title))) { display: none; }
.rxdbv-phone-field .rxdbv-phone-field-label { color: var(--rxdbv-fg-dim); font-size: 10px; }
